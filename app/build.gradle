plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fnadroid.controller'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.fnadroid.controller'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '2.0'
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/cpp/Android.mk')
        }
    }
}

dependencies {
}
